name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Verify Codex plugin symlink
        run: ./scripts/sync-codex-plugin.sh --check
      - name: Run repository tests
        run: make test
