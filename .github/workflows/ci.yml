name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      # A native stack is one release; intermediate PRs keep the base version.
      - name: Check release version against base
        if: github.event_name == 'pull_request' && (!github.event.pull_request.stack || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
        env:
          BASE_REV: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_REV"
          node scripts/check-version-bump.js "$BASE_REV"
      - name: Run repository tests
        run: make test
